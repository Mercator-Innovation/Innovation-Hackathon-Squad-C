<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <span class="brand">
      <svg class="logo" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <path class="logo-arc" d="M 4 14 A 8 8 0 1 1 20 14" pathLength="1" />
        <circle class="logo-dot" cx="12" cy="14" r="3.5" />
      </svg>
      <span class="app-name" id="app-name"></span>
    </span>
    <button type="button" class="quick-exit" id="quick-exit"></button>
  </header>

  <nav class="back-nav" aria-label="Back">
    <button type="button" class="btn-back" id="back" hidden></button>
  </nav>

  <main id="screen" tabindex="-1" aria-live="polite"></main>

  <footer class="bottom">
    <p class="emergency" id="emergency"></p>
    <p class="demo-note" id="demo-note"></p>
  </footer>

  <script src="data/people.js"></script>
  <script src="data/services.js"></script>
  <script src="data/meetings.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
  <script src="theme.js"></script>
  <!-- Each journey in its own file. Until a file exists, its button shows "Coming soon". -->
  <script src="signup.js"></script>
  <script src="supporter.js"></script>
  <script src="checkin.js"></script>
</body>
</html>
